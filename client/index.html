<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">  <title>Fighting game</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      display: block;
    }

    @media (orientation: portrait) and (pointer: coarse) {
      canvas {
        width: min(100vh, calc(100vw * 16 / 9));
        height: min(100vw, calc(100vh * 9 / 16));
        transform: rotate(90deg);
      }
    }
  </style>
</head>

<body>
  <canvas></canvas>
  <script src="/socket.io.js"></script>
  <script>
    const socket = io('localhost:3000');
  </script>
  <script src="classes.js"></script>
  <script src="app.js"></script>
</body>

</html>
