services:
  node:
    image: node:26-alpine3.23
    container_name: fighting-game-node
    ports:
      - '3000:3000'
    volumes:
      - .:/app
    working_dir: /app
    command: ash -c "npm install && node --inspect=0.0.0.0 server/app.js"

  nginx:
    image: nginx:1.31.5-alpine3.24
    container_name: fighting-game-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./client:/var/www/html
    depends_on:
      - node
